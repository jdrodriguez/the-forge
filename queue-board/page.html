// One plain read of where a live ticket stands, its severity, and the parts behind it.
function standing(t) {
  const pr = t.pr;
  // A worker outside the queue that is done has finished its task; the session that started it drives what follows.
  const ended = ['failed', 'stopped', 'gone', 'limit'].includes(t.workerState) || (!t.adhoc && t.workerState === 'done');
  if (t.adhoc && !pr && t.workerState === 'done') return { sev: 'ok', short: 'finished', long: `${cap(called(t))} finished, no PR` };
  if (t.adhoc && !t.branch && !t.blockedSince) return { sev: 'run', short: 'working', long: 'Working, no branch of its own' };
  if (t.status === 'merge-asked') return { sev: 'warn', short: 'needs your merge', long: 'Green, waiting on your merge (touches reviewed paths)' };
  if (t.blockedSince) return { sev: 'bad', short: `${called(t)} is blocked`, long: `${cap(called(t))} is waiting on input for ${dur(ms(t.blockedSince))}` };
  // A green PR in main's merge queue lands once the queue's own checks pass, so it is in flight, not stalled.
  const queued = pr?.mergeQueue;
  if (queued) return { sev: 'ok', short: `#${pr.number} in merge queue`, long: `Green, in the merge queue (${queued.state.toLowerCase().replace(/_/g, ' ')}, position ${queued.position})` };
  if (t.stalledSince) return { sev: 'bad', short: 'stalled', long: `Stalled since ${ago(t.stalledSince)}` };
  if (!pr) {
    if (ended) return { sev: 'bad', short: `${workerIs(t)}, no PR`, long: t.workerState === 'limit' ? `${cap(workerIs(t))} before opening a PR` : t.contained ? `${cap(called(t))}'s run was stopped by the containment audit before opening a PR` : `${cap(called(t))}'s ${t.driver === 'engine' ? 'run' : 'session'} ended (${t.workerState}) before opening a PR` };
    return { sev: 'run', short: t.branchCommitAt ? 'building, pushed' : 'building, no PR', long: t.branchCommitAt ? `Building, last push ${ago(t.branchCommitAt)}, no PR yet` : 'Building, nothing pushed yet' };
  }
  const bits = [];
  let sev = 'run';
  if (pr.draft) bits.push('draft');
  // GitHub's BLOCKED says only that something stops the merge; name what, so it never reads as a stuck worker.
  const held = pr.review === 'fail' ? 'review failed' : pr.review !== 'pass' ? 'waiting on review' : pr.openThreads ? `${pr.openThreads} open thread${pr.openThreads > 1 ? 's' : ''}` : 'not mergeable yet';
  const msMap = { DIRTY: 'conflicts with main', BEHIND: 'behind main', BLOCKED: held, UNSTABLE: 'checks failing', CLEAN: 'mergeable', HAS_HOOKS: 'mergeable', UNKNOWN: 'GitHub still checking' };
  if (pr.mergeState === 'DIRTY') sev = 'warn';
  if (pr.ci.fail.length) sev = 'bad';
  if (ended && sev !== 'ok') sev = 'bad';
  const green = (t.note || '').startsWith('green');
  if (green || reviewerWait(t)) sev = 'ok';
  const short = pr.ci.fail.length ? `CI failing (${pr.ci.fail.length})` : pr.ci.running.length ? 'CI running' : pr.mergeState === 'DIRTY' ? 'conflicts' : reviewerWait(t) ? `waiting on ${snap.config.reviewer}` : green ? 'green' : (msMap[pr.mergeState] || pr.mergeState || 'open').toLowerCase();
  // The card says what is happening now (the slot's word) and then what holds the merge, so slot and card agree.
  const merge = green ? '' : (msMap[pr.mergeState] || pr.mergeState || '').toLowerCase();
  bits.unshift(cap(short));
  if (merge && merge !== short.toLowerCase()) bits.push(merge);
  if (ended) bits.push(workerIs(t));
  return { sev, short: `#${pr.number} ${short}`, long: bits.filter(Boolean).join(', ') };
}

// A Sentry fix that waits on the reviewer's review (snap.config.reviewer, the config's reviewer.name), or on a worker
// addressing their changes (dispatcher.mjs, 2026-11-05). The dispatcher holds it, so its finished worker is expected
// and never an alert. With no reviewer configured nothing waits on one.
function reviewerWait(t) {
  const r = snap.config.reviewer;
  if (!r) return false;
  const q = String(r).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp(`^(waiting on ${q}|${q} requested changes)`).test(t.note || '');
}

function attention() {
  const out = [];
  const asked = new Set((snap.asks || []).map((a) => a.id));
  for (const a of snap.asks || []) {
    out.push({ sev: 'bad', kind: a.type, id: a.id, url: a.url, title: a.title, when: a.createdAt,
      text: a.question, sub: [a.blockedOn && `Blocked on: ${a.blockedOn}`, a.recommend && `Recommends: ${a.recommend}`, a.from && `From ${a.from}`].filter(Boolean).join('. ') });
  }
  for (const t of snap.tickets.filter((x) => x.live)) {
    const where = [t.machine, acctText(t.accountEmail, t.accountPlan, t.account)].filter(Boolean).join(', ');
    if (t.status === 'merge-asked' && !asked.has(t.id)) out.push({ sev: 'bad', kind: 'Merge', id: t.id, label: t.label, url: t.url, title: t.title, when: null, text: `PR #${t.prNumber} is green but touches paths you review yourself.`, href: t.pr?.url });
    if (t.blockedSince && !asked.has(t.ticket)) out.push({ sev: 'bad', kind: 'Blocked', id: t.id, label: t.label, url: t.url, title: t.title || t.name, when: t.blockedSince, text: t.driver === 'engine' ? `${cap(called(t))}, the ${engineName(t)} worker on ${t.machine}, stopped with a question${t.question ? `: ${t.question}` : '.'}` : `${cap(called(t))}${t.adhoc ? ', started outside the queue,' : ''} is waiting on input in its session (${where}).`, cmd: t.attach, host: t.host });
    if (t.stalledSince && !t.pr?.mergeQueue) out.push({ sev: 'warn', kind: 'Stalled', id: t.id, label: t.label, url: t.url, title: t.title, when: t.stalledSince, text: `Nothing has moved since ${ago(t.lastProgressAt)}.`, cmd: t.attach, host: t.host });
    const ended = ['failed', 'done', 'stopped', 'gone', 'limit'].includes(t.workerState);
    if (ended && t.status === 'building' && !(t.note || '').startsWith('green') && !reviewerWait(t)) {
      out.push({ sev: 'warn', kind: 'Ended', id: t.id, label: t.label, url: t.url, title: t.title, when: t.lastProgressAt,
        text: `${cap(called(t))}'s ${t.driver === 'engine' ? 'run' : 'session'} ${t.workerState === 'gone' ? 'is gone' : t.workerState === 'limit' ? `hit ${engineName(t)}'s limit` : `shows ${t.workerState}`}, but ${t.pr ? `PR #${t.pr.number} is ${t.note || 'not green'}` : 'no PR exists'}. Nothing is driving it.`, cmd: t.attach, host: t.host });
    }
    if (t.effectErrors) out.push({ sev: 'warn', kind: 'Side effect', id: t.id, label: t.label, url: t.url, title: t.title, text: `${t.effectErrors} dispatcher side effect(s) failed on ${t.machine}; see its log.` });
  }
  const stuckIds = snap.labeledStuck ? new Set(snap.labeledStuck) : null;
  const seen = new Set();
  for (const t of snap.tickets.filter((x) => x.status === 'stuck').sort((a, b) => (b.stuckAt || '').localeCompare(a.stuckAt || ''))) {
    if (seen.has(t.id) || (stuckIds && !stuckIds.has(t.id))) continue;
    seen.add(t.id);
    out.push({ sev: 'warn', kind: 'Stuck', id: t.id, label: t.label, url: t.url, title: t.title, when: t.stuckAt, text: t.reason || 'The dispatcher gave up on it.', sub: `To re-queue: remove ${snap.config.labels?.stuck ?? 'agent-stuck'} and add ${snap.config.labels?.ready ?? 'agent-ready'}.` });
  }
  for (const m of snap.machines) {
    if (!m.ok) out.push({ sev: 'bad', kind: 'Machine', title: m.name, text: `${unreachable(m.error)} Showing what it reported ${ago(m.fetchedAt)}.` });
    if (m.paused) out.push({ sev: 'bad', kind: 'Paused', title: m.name, text: m.paused, sub: `Resume with: node ${m.root ?? snap.config.repoDir ?? '.'}/dispatcher/dispatcher.mjs resume` });
    if (m.lastError) out.push({ sev: 'warn', kind: 'Tick error', title: m.name, text: m.lastError });
    const noTicks = m.lastTick && ms(m.lastTick) > 45 * 60000;
    const handOff = 'Sentry tickets pass to the next machine in the Sentry cascade until it is back.';
    if (noTicks) out.push({ sev: 'warn', kind: 'No ticks', title: m.name, text: `Last tick ${ago(m.lastTick)}; it should tick every ${snap.config.tickMinutes} minutes.${m.sentryWorkers ? ` Meanwhile ${handOff}` : ''}` });
    // Ticking but stale here means the shared folder's sync is not carrying its heartbeat, so the others stop leaving it Sentry work.
    else if (m.ok && !m.paused && sentryOff(m)) out.push({ sev: 'warn', kind: 'Sentry slot', title: m.name, text: `${cap(sentryOff(m))}, so ${handOff}` });
    if (m.ok && swapRatio(m) >= SWAP_BAD) out.push({ sev: 'warn', kind: 'Swapping', title: m.name, text: `${swapText(m)}, so its builds and tests crawl.` });
    // A signed-out account and how to sign it back in: account a is that machine's own login, any other its fleet folder.
    for (const l of m.signedOut) {
      const a = acctOf(m, l);
      const fix = l === 'a' ? `run claude auth login in a terminal on ${m.name}${a.email ? `, as ${a.email}` : ''}`
        : `run ${snap.config.addAccountScript ?? 'fleet/setup/add-account.sh'} ${m.host === boardHost() ? 'here' : m.name} ${l}${a.email ? ` ${a.email}` : ''}`;
      out.push({ sev: 'warn', kind: 'Signed out', title: m.name, when: a.signedOutAt, text: `${a.email ? `Account ${l}, ${acctText(a.email, a.plan)},` : `Account ${l}`} is signed out on ${m.name}, so it gets no work there. To sign it back in, ${fix}.` });
    }
  }
  for (const [k, v] of Object.entries(snap.errors || {})) out.push({ sev: 'warn', kind: k === 'github' ? 'GitHub' : 'Linear', title: 'Board', text: `Could not read ${k === 'github' ? 'PRs' : 'Linear'}: ${v}` });
  return out;
}

// Swap against RAM (2026-11-05). Memory free, the dispatcher's gate, can read healthy while a machine pages all day:
// one machine read 39% free with 14 GB swapped on 24 GB of RAM, and its type-checks crawled at 4% CPU.
const SWAP_WARN = 0.25;
const SWAP_BAD = 0.5;
const gb = (mb) => (mb < 1024 ? `${mb} MB` : `${+(mb / 1024).toFixed(1)} GB`);
const ram = (m) => `${Math.round(m.ramMb / 1024)} GB`;
const swapRatio = (m) => (m.swapUsedMb == null || !m.ramMb ? null : m.swapUsedMb / m.ramMb);
const biggest = (m) => (m.topMemory ? `the largest process is ${m.topMemory.command} (PID ${m.topMemory.pid}) at ${gb(m.topMemory.mb)}` : '');
const swapText = (m) => `${gb(m.swapUsedMb)} swapped on ${ram(m)} of RAM${m.topMemory ? `; ${biggest(m)}` : ''}`;

// Every building ticket counts against maxConcurrent, whichever account runs it.
const slotCap = () => Math.min(snap.machines.reduce((n, m) => n + (m.maxWorkers || 0), 0), snap.config.maxConcurrent);
// A ticket holds one of its machine's slots, as the dispatcher counts them, only while it builds: a green PR waiting on
// the orchestrator's merge (merge-asked) or parked on the reviewer's review holds none. The board still shows its worker, after
// the slots with a note, so it is never lost. Across machines a merge-asked ticket still counts against maxConcurrent.
const holdsSlot = (t) => t.status !== 'merge-asked' && !t.parked;
const slotWait = (t) => (t.status === 'merge-asked' ? 'waiting on the orchestrator' : `waiting on ${snap.config.reviewer || 'the reviewer'}`);
const buildingCount = (live) => live.filter((t) => !t.sentry && !t.parked).length;
// A Codex or Grok worker (the dispatcher's driver 'engine'). Since 2026-11-09 it holds a slot in its machine's pool like
// any worker (Codex is just a regular slot); it differs only in having no Claude session to attach to.
const onEngine = (t) => t.driver === 'engine';
// Sentry slots (2026-11-05): a machine with sentryWorkers keeps side slots for Sentry fix tickets (the config's sentry label),
// apart from its regular maxWorkers, so the board counts them on their own: a busy one never makes a machine look
// over-full and an idle one is never a free regular slot. Since 2026-11-09 every machine has one, and a Sentry ticket
// cascades down snap.config.sentryCascade (for example Erebor, then Rivendell, then the Shire) to the first machine whose heartbeat
// is fresh, unpaused and says it has Sentry room: a free Sentry slot, not busy, and an account with headroom.
const beatFresh = (m) => Boolean(m.heartbeat && !m.heartbeat.paused && ms(m.heartbeat.at) < snap.config.sentryHeartbeatMinutes * 60000);
const sentryOrder = () => (snap.config.sentryCascade ?? []).map((h) => snap.machines.find((m) => m.host === h)).filter(Boolean);
// Where the next Sentry ticket goes, or null while no Sentry slot in the cascade has room.
const sentryHost = () => sentryOrder().find((m) => beatFresh(m) && m.heartbeat.sentryRoom !== false) ?? null;
// Why a Sentry host's slot is out of the cascade, or null while it is live.
const sentryOff = (m) => (!m.sentryWorkers || beatFresh(m) ? null
  : !m.heartbeat ? 'it has no heartbeat yet' : m.heartbeat.paused ? 'it is paused' : `its heartbeat is ${dur(ms(m.heartbeat.at))} old`);
// The Sentry slots in one line: idle, busy or offline for one slot, a count for more. A ticket parked on the reviewer's review
// (its green PR waits only on them) holds no slot, so the next Sentry fix can start meanwhile.
function sentrySlots(live) {
  const total = snap.machines.reduce((n, m) => n + (m.sentryWorkers || 0), 0);
  const used = live.filter((t) => t.sentry && !t.parked).length;
  if (!total) return null;
  return { total, used, text: total === 1 ? `Sentry slot ${used ? 'busy' : sentryHost() ? 'idle' : 'offline'}` : `${used} of ${total} Sentry slots busy` };
}
const sentryChip = (t) => (t.sentry ? `<span class="chip sentry" title="In ${esc(t.machine)}'s Sentry slot, apart from its regular slots">${ICON.sentry}Sentry</span>` : '');
const mergedTickets = () => {
  const seen = new Set();
  return snap.tickets.filter((t) => t.status === 'merged').sort((a, b) => b.mergedAt.localeCompare(a.mergedAt)).filter((t) => !seen.has(t.id) && seen.add(t.id));
};

// Worktree states (worktree-state.mjs) in the order the Worktrees view lists them: a label, the words after a count on
// a chip, and the words after a count in a sentence.
const WT_STATE = { active: ['In use', 'in use', 'in use'], open: ['PR open', 'PR open', 'with an open PR'], local: ['Not pushed', 'not pushed', 'not pushed'],
  closed: ['PR closed', 'PR closed', 'with a closed PR'], merged: ['Merged', 'merged', 'merged'], nopr: ['No PR', 'no PR', 'with no PR'],
  missing: ['Folder missing', 'folder missing', 'with no folder'] };
const wtOf = (host) => (snap.worktrees?.machines || []).find((m) => m.host === host);
const wtCounts = (rows) => Object.keys(WT_STATE).map((s) => [s, rows.filter((r) => r.state === s).length]).filter(([, n]) => n);

// The sidebar: the Inbox view, the Sessions view, the Queue view with its groups, the Machines view with each machine,
// then the Worktrees view with each machine's count. On a phone it is a bar along the bottom (Inbox, Sessions, Queue,
// Middle-earth) with the rest behind More (mobile.css, mobile.js). Inbox counts the mentions, replies and review
// requests; Sessions the sessions waiting on the owner that they haven't marked handled.
function renderNav(live, adhoc, slotted, needs, merged) {
  const hot = needs.some((n) => n.sev === 'bad');
  const item = (href, icon, text, count, cls, attrs) => `<a class="nav-item ${cls}" href="${href}" ${attrs}>${icon}<span class="nav-t">${esc(text)}</span>${count != null ? `<span class="count${cls.includes('hot') ? ' hot' : ''}">${count}</span>` : ''}</a>`;
  const viewItem = (v, href, icon, text, count = null, hot = false) => item(href, icon, text, count, `view${v === 'queue' ? ' desk' : ''}${view === v ? ' active' : ''}${hot ? ' hot' : ''}`, `data-go data-view="${v}"`);
  const wtMachines = (snap.worktrees?.machines || []).filter((m) => m.rows);
  const aimed = (snap.inbox?.forYou ?? []).filter((n) => n.kind !== 'assigned').length;
  const plusSentry = (list) => { const n = list.filter((t) => t.sentry && !t.parked).length; return n ? ` +${n}` : ''; };
  // A machine's side slots in use after its regular count: Sentry and Codex or Grok.
  const plusSide = (list) => { const n = list.filter((t) => t.sentry && !t.parked).length; return n ? ` +${n}` : ''; };
  const waiting = typeof sessNeedCount === 'function' ? sessNeedCount() : null;
  $('nav').innerHTML = viewItem('inbox', '#inbox', ico('inbox', 'todo'), 'Inbox', aimed || null, aimed > 0)
    + viewItem('sessions', '#sessions', ico('comment', 'todo'), 'Sessions', waiting || null, waiting > 0)
    + viewItem('queue', '#queue', ico('list', 'todo'), 'Queue')
    + item('#sec-needs', ico('seal', hot ? 'bad' : needs.length ? 'warn' : 'free'), 'Needs you', needs.length, `nav-sub${hot ? ' hot' : ''}`, 'data-jump')
    + item('#sec-building', ico('run'), 'Building', `${buildingCount(live)}/${slotCap()}${plusSentry(live)}`, 'nav-sub', 'data-jump')
    + item('#sec-adhoc', ico('run'), 'Outside the queue', adhoc.length, 'nav-sub', 'data-jump')
    + item('#sec-ready', ico('todo'), 'Ready queue', snap.ready ? snap.ready.length : '?', 'nav-sub', 'data-jump')
    + item('#sec-merged', ico('ok', 'merged'), 'Merged', merged.length, 'nav-sub', 'data-jump')
    + viewItem('scene', '#scene', ico('peak', 'todo'), 'Middle-earth', slotted.length || null)
    + viewItem('map', '#map', ico('peak', 'todo'), 'From above (v2)')
    + viewItem('machines', '#machines', ico('machine', 'todo'), 'Machines')
    + snap.machines.map((m) => {
      const mine = slotted.filter((t) => t.host === m.host);
      const off = !m.ok || m.paused;
      return item(`#machines/${encodeURIComponent(m.host)}`, sigil(m.host, off ? 'var(--bad)' : machineColor(m.host)), realmName(m.host),
        m.maxWorkers ? `${mine.filter((t) => !t.sentry && holdsSlot(t)).length}/${m.maxWorkers}${plusSide(mine)}` : (off ? (m.ok ? 'paused' : 'down') : 'idle'), 'nav-sub desk', 'data-go');
    }).join('')
    + acctNav(item)
    + viewItem('worktrees', '#worktrees', ico('branch', 'todo'), 'Worktrees', wtMachines.length ? wtMachines.reduce((n, m) => n + m.rows.length, 0) : null)
    + wtMachines.map((m) => item(`#worktrees/${encodeURIComponent(m.host)}`, sigil(m.host, machineColor(m.host)), realmName(m.host), m.rows.length, 'nav-sub desk', 'data-go')).join('')
    + (typeof grReport === 'function' ? viewItem('gollum', '#gollum', ico('warn', 'warn'), 'Gollum', grReport().n + grReport().ring.length || null, grReport().ring.length > 0) : '');
}

// The Accounts card's link (machines-accounts.js), with how many of Claude's, Codex's and Grok's accounts have room.
function acctNav(item) {
  if (typeof accountGroups !== 'function') return '';
  const all = accountGroups(snap.config.headroomFloorPercent).flatMap(([, rows]) => rows);
  if (!all.length) return '';
  return item('#machines/accounts', '<span class="mdot" data-r="stones" aria-hidden="true"></span>', 'Accounts', `${all.filter((r) => r.room).length}/${all.length}`, 'nav-sub desk', 'data-go');
}

function renderStats(live, adhoc, needs) {
  const paused = snap.machines.filter((m) => m.paused).length;
  const hot = needs.some((n) => n.sev === 'bad');
  const sentry = sentrySlots(live);
  // What needs the owner leads, coloured when it isn't zero; then the work in flight, the queue, and anything unusual.
  $('stats').innerHTML = [
    needs.length ? `<span class="stat${hot ? ' hot' : ' warm'}"><b class="seal${hot ? '' : ' warm'}">${needs.length}</b><span>need${needs.length === 1 ? 's' : ''} you</span></span>`
      : `<span class="stat">${ico('seal', 'free')}<span><b>0</b> need you</span></span>`,
    paused ? `<span class="stat hot">${ico('bad')}<span><b>${paused}</b> paused</span></span>` : '',
    `<span class="stat">${ico('run')}<span><b>${buildingCount(live)}</b> of ${slotCap()} building</span></span>`,
    `<span class="stat">${ico('todo')}<span><b>${snap.ready ? snap.ready.length : '?'}</b> ready</span></span>`,
    adhoc.length ? `<span class="stat">${ico('run')}<span><b>${adhoc.length}</b> outside the queue</span></span>` : '',
    sentry ? `<span class="stat">${ico('sentry', sentry.used ? 'run' : 'todo')}<span>${esc(sentry.text)}</span></span>` : '',
  ].join('');
}

// The slots, one group per machine as its realm: the realm's name, how many of its seats are at work, a card per busy
// worker, then one small marker for the free seats and one for the Sentry slot, so empty seats cost no room. Groups sit
// side by side and wrap; each card links to the worker's full card below.
function renderBays(live) {
  $('bays').innerHTML = snap.machines.map((m) => {
    const mine = live.filter((t) => t.host === m.host);
    const regular = mine.filter((t) => !t.sentry && holdsSlot(t));
    const sentry = mine.filter((t) => t.sentry);
    // Workers holding no slot (a PR waiting on a merge, or parked on the reviewer's review) come last, after the free seats.
    const waits = mine.filter((t) => !t.sentry && !holdsSlot(t));
    const n = Math.max(m.maxWorkers || 0, regular.length);
    const k = Math.max(m.sentryWorkers || 0, sentry.length);
    if (!n && !k && !waits.length) return '';
    const mc = machineColor(m.host);
    const off = sentryOff(m);
    const free = n - regular.length;
    const bay = (t) => {
      const s = standing(t);
      return `<a class="bay${holdsSlot(t) ? '' : ' out'}" href="#${esc(t.id)}" style="--mc:${mc}"${holdsSlot(t) ? '' : ` title="${esc(`Holds no slot: ${slotWait(t)}`)}"`}><span class="id">${ico(s.sev, s.sev, s.long)}<span class="ids">${t.nickname ? `${wname(t)} ` : aiMark(workerAi(t))}${esc(t.label || t.id).replace(/\b([A-Z]+-)(?=\d)/g, '<span class="pfx">$1</span>')}</span></span>
        <span class="what" title="${esc(t.title || t.name)}">${esc(cap(t.adhoc ? `outside the queue, ${s.short}` : s.short))}</span><span class="when">${t.sentry ? `<span class="stag" role="img" aria-label="Sentry slot" title="In the Sentry slot">${ICON.sentry}</span>` : ''}${onEngine(t) ? `${engineTag(t)} ` : ''}${dur(ms(t.dispatchedAt))} in, moved ${dur(ms(t.lastProgressAt))} ago</span>${figureAvatar(t)}</a>`;
    };
    const seats = `${regular.length} of ${n} at work${waits.length ? `, ${waits.length} waiting` : ''}`;
    const sentryIdle = k && !sentry.some((t) => !t.parked) ? `<div class="bay seat${off ? ' off' : ''}" style="--mc:${mc}" title="${esc(off ? `Offline to the other machines (${off}), so they build Sentry tickets themselves` : 'Kept for Sentry fix tickets; regular work never takes it')}">${ico('sentry', off ? 'warn' : 'free')}Sentry ${off ? 'offline' : 'idle'}</div>` : '';
    return `<section class="realm-row" style="--mc:${mc}"><h3 class="realm-head">${sigil(m.host)}${esc(realmName(m.host))}<span class="muted">${esc(m.name)}, ${seats}</span></h3>
      <div class="realm-bays">${regular.map(bay).join('')}${free > 0 ? `<div class="bay seat" style="--mc:${mc}" title="Free seats on ${esc(m.name)}">${ico('free')}${free} free</div>` : ''}${sentry.map(bay).join('')}${sentryIdle}${waits.map(bay).join('')}</div></section>`;
  }).join('');
  paintAvatars($('bays'));
}

function renderNeeds(needs) {
  const hot = needs.some((n) => n.sev === 'bad');
  $('cNeeds').textContent = needs.length;
  $('cNeeds').className = `gcount${needs.length ? ` seal${hot ? '' : ' warm'}` : ''}`;
  $('gNeedsIco').className = `ico ${hot ? 'bad' : needs.length ? 'warn' : 'free'}`;
  // Always first in the Queue, so the eye knows where to look; with nothing waiting it shrinks to one calm line.
  $('sec-needs').classList.toggle('quiet', !needs.length);
  if (!needs.length) { $('needs').innerHTML = `<div class="all-clear">${ico('ok', 'ok')}Nothing needs you right now.<span class="lore">All is quiet in the realms.</span></div>`; return; }
  const worker = (n) => (n.id ? snap.tickets.find((t) => t.id === n.id && t.nickname) : null);
  $('needs').innerHTML = needs.map((n) => `<div class="row need">
    ${ico('seal', n.sev === 'warn' ? 'warn' : 'bad', n.sev === 'warn' ? 'Worth a look' : 'Needs you')}
    <div class="rbody">
      <div class="rline"><span class="chip ${n.sev === 'warn' ? 'warn' : 'bad'}">${esc(cap(n.kind))}</span>${worker(n) ? figureAvatar(worker(n)) : ''}${wname(worker(n))}${n.id ? `<span class="rid">${link(n.url, n.label || n.id)}</span>` : ''}<span class="rtitle" title="${esc(n.title || '')}">${esc(n.title || '')}</span>${n.when ? `<span class="rmeta">${ago(n.when)}</span>` : ''}</div>
      <div class="rtext">${linkify(n.text)}${n.href ? ` ${link(n.href, 'Open PR')}` : ''}</div>
      ${n.sub ? `<div class="rsub">${linkify(n.sub)}</div>` : ''}
      ${n.cmd ? openSession(n.id, n.cmd) : ''}
    </div></div>`).join('');
  paintAvatars($('needs'));
}
// View session opens the history and message panel (session.js). The board server builds the attach command (with
// ssh for a worker on another machine), and Open in terminal asks it to open that in iTerm on this Mac.
const openSession = (id, cmd) => `<div class="open-row"><button class="open primary view" data-id="${esc(id)}">View session</button><button class="open" data-id="${esc(id)}">Open in terminal</button><span class="msg"></span></div>
  <details><summary>Command</summary><code class="cmd">${esc(cmd)}</code></details>`;

// The worker's Middle-earth nickname, ahead of its ticket ID: the dispatcher's, or board.mjs nameWorkers' for a worker
// outside the queue.
const wname = (t) => (t?.nickname ? `<span class="wname">${aiMark(workerAi(t))}${esc(t.nickname)}</span>` : '');
function workerChip(t) {
  const cls = { busy: 'run', working: 'run', idle: 'warn', blocked: 'bad', failed: 'bad', limit: 'bad', done: 'warn', stopped: 'warn', gone: 'bad' }[t.workerState] || '';
  return `<span class="chip ${cls}">${esc(cap(workerIs(t)))}</span>`;
}

function renderCards(live) {
  const sentry = live.filter((t) => t.sentry).length;
  $('cBuilding').textContent = `${live.length - sentry} of ${slotCap()}${sentry ? `, plus ${sentry} Sentry` : ''}`;
  if (!live.length) { $('cards').innerHTML = '<div class="empty">No workers are building right now.<span class="lore">Every seat in the realms stands empty.</span></div>'; return; }
  $('cards').innerHTML = live.map(cardHtml).join('');
  paintAvatars($('cards'));
}

// Fleet workers another session started with fleet.sh dispatch, outside the queue's slots.
function renderAdhoc(adhoc) {
  $('cAdhoc').textContent = adhoc.length;
  if (!adhoc.length) { $('adhoc').innerHTML = '<div class="empty">No other fleet workers are running.<span class="lore">No wanderers on the road.</span></div>'; return; }
  $('adhoc').innerHTML = adhoc.map(cardHtml).join('');
  paintAvatars($('adhoc'));
}

function cardHtml(t) {
  const s = standing(t), pr = t.pr;
  const ci = pr ? (pr.ci.fail.length ? `<span class="chip bad">${pr.ci.fail.length} failing</span>` : '') + (pr.ci.running.length ? `<span class="chip run">${pr.ci.running.length} running</span>` : '') + `<span class="chip ${pr.ci.fail.length ? '' : 'ok'}">${pr.ci.pass} passed</span>` : '';
  const review = pr ? `<span class="chip ${{ pass: 'ok', fail: 'bad', running: 'run' }[pr.review] || ''}">review ${pr.review === 'missing' ? 'not started' : pr.review}</span>` : '';
  // Left out when the status already names the open threads as what holds the merge.
  const threads = pr && pr.openThreads && !s.long.includes('open thread') ? `<span class="chip warn">${pr.openThreads} open thread${pr.openThreads > 1 ? 's' : ''}</span>` : '';
  // A worker outside the queue may have no ticket; its session name then stands in for the title.
  const title = t.title || (t.adhoc && !t.ticket ? t.name : '');
  const named = t.adhoc && t.ticket && t.name ? `<span class="chip mono" title="worker session name">${esc(t.name)}</span>` : '';
  return `<article class="row build" id="${esc(t.id)}" style="--mc:${machineColor(t.host)}">
    ${ico(s.sev, s.sev, s.long)}
    <div class="rbody">
      <div class="rline">${figureAvatar(t)}${wname(t)}<span class="rid">${ticketLinks(t)}</span><span class="rtitle">${esc(title || '')}</span></div>
      ${bundleLines(t)}
      <div class="chips"><span class="chip ${s.sev}" title="${esc(s.long)}">${esc(s.long)}</span>${t.waiting ? '<span class="chip warn">waiting on your answer</span>' : ''}${workerChip(t)}${t.driver !== 'engine' && t.engine ? `<span class="chip engine" title="${esc(t.engine)} writes the code, a Claude worker drives and reviews">built by ${aiMark(t.engine)}</span>` : ''}${sentryChip(t)}${named}</div>
      ${pr ? `<div class="chips"><a class="chip" href="${esc(pr.url)}" target="_blank" rel="noopener">${ICON.pr}PR #${pr.number}</a>${pr.mergeQueue ? `<span class="chip ok">merge queue, position ${pr.mergeQueue.position}</span>` : ''}${ci}${review}${threads}</div>` : ''}
      ${pr && pr.ci.fail.length ? `<div class="fails">Failing: ${esc(pr.ci.fail.slice(0, 4).join('; '))}${pr.ci.fail.length > 4 ? '; ...' : ''}</div>` : ''}
      <dl class="facts">
        <div><dt>Running</dt><dd>${dur(ms(t.dispatchedAt))}</dd></div>
        <div><dt>${t.adhoc ? 'Last activity' : 'Last progress'}</dt><dd>${ago(t.lastProgressAt)}</dd></div>
        <div><dt>Last push</dt><dd>${ago(pr ? pr.lastCommitAt : t.branchCommitAt)}</dd></div>
        <div><dt>On</dt><dd>${esc(realmName(t.host))} (${esc(t.machine)})${acctText(t.accountEmail, t.accountPlan, t.account) ? `, ${esc(acctText(t.accountEmail, t.accountPlan, t.account))}` : ''}</dd></div>
        <div><dt>Worker</dt><dd class="mono">${esc(t.workerId || 'n/a')}</dd></div>
      </dl>
      ${t.note && !/^not green: (merge state \w+|no PR yet)$/.test(t.note) ? `<div class="note">Dispatcher: ${esc(t.note)}</div>` : ''}
      ${t.attach ? openSession(t.id, t.attach) : onEngine(t) ? `<div class="open-row"><button class="open primary view" data-id="${esc(t.id)}">View session</button></div>` : ''}
    </div>
  </article>`;
}

function renderReady() {
  $('cReady').textContent = snap.ready ? snap.ready.length : '';
  if (!snap.ready) { $('ready').innerHTML = '<div class="empty">Linear did not answer; the ready list is unknown.</div>'; return; }
  if (!snap.ready.length) { $('ready').innerHTML = `<div class="empty">Nothing is labeled ${esc(snap.config.labels?.ready ?? 'agent-ready')}.<span class="lore">The road ahead is clear.</span></div>`; return; }
  const top = snap.ready.slice(0, 12);
  // A Sentry ticket goes to the first machine in the Sentry cascade with Sentry room; with none, it waits for one.
  const host = sentryHost(), line = sentryOrder().map((m) => realmName(m.host)).join(', then ');
  const sentry = (r) => (!r.sentry ? '' : `<span class="chip sentry" title="${esc(`Labeled ${snap.config.labels?.sentry ?? 'sentry-triaged'}. It goes to the first machine with Sentry room, in the order ${line}: ${host ? `now ${realmName(host.host)}` : 'none has room now, so it waits'}.`)}">${ICON.sentry}${host ? `<span class="opt">for ${esc(realmName(host.host))}'s </span>Sentry<span class="opt"> slot</span>` : 'Sentry<span class="opt">, waiting for room</span>'}</span>`);
  $('ready').innerHTML = top.map((r) => `<div class="row li">${priIco(r.priority)}<div class="rbody"><div class="rline"><span class="rid">${link(r.url, r.id)}</span><span class="rtitle" title="${esc(r.title)}">${esc(r.title)}</span>
    <span class="rmeta">${sentry(r)}${r.waitingOn ? `<span class="chip warn opt" title="Waiting on ${esc(r.waitingOn)}">waiting on ${esc(r.waitingOn)}</span>` : ''}<span>${dur(ms(r.createdAt))}</span></span></div></div></div>`).join('')
    + (snap.ready.length > top.length ? `<div class="more-row">and ${snap.ready.length - top.length} more</div>` : '');
}

function renderMerged(merged) {
  $('cMerged').textContent = merged.length;
  if (!merged.length) { $('merged').innerHTML = '<div class="empty">Nothing merged in the last 48 hours.<span class="lore">No new tales to tell.</span></div>'; return; }
  const shown = mergedAll ? merged : merged.slice(0, MERGED_SHOWN);
  // The name sits in a fixed column, empty for a worker named before nicknames, so every title starts at the same place.
  $('merged').innerHTML = shown.map((t) => `<div class="row li">${ico('ok', 'merged', 'Merged')}<div class="rbody"><div class="rline"><span class="wname col">${esc(t.nickname || '')}</span><span class="rid">${ticketLinks(t)}</span><span class="rtitle" title="${esc(t.title || '')}">${esc(t.title || '')}</span>
    <span class="rmeta">${sentryChip(t)}${t.linearState ? `<span class="chip opt">${esc(t.linearState)}</span>` : ''}${t.prUrl ? `<span class="opt">${link(t.prUrl, `PR #${t.prUrl.split('/').pop()}`)}</span>` : ''}<span class="mini-host opt" style="--mc:${machineColor(t.host)}" title="${esc(t.machine)}">${sigil(t.host)}${esc(realmName(t.host))}</span><span>${ago(t.mergedAt)}</span></span></div></div></div>`).join('')
    + (merged.length > MERGED_SHOWN ? `<div class="more-row"><button class="show-all merged-all" type="button">${mergedAll ? 'Show the latest 10' : `Show all ${merged.length}`}</button></div>` : '');
}

function render() {
  if (!snap) return;
  const order = (t) => snap.machines.findIndex((m) => m.host === t.host);
  const byStart = (a, b) => order(a) - order(b) || (a.dispatchedAt || '').localeCompare(b.dispatchedAt || '');
  const live = snap.tickets.filter((t) => t.live && !t.adhoc).sort(byStart);
  const adhoc = snap.tickets.filter((t) => t.adhoc).sort(byStart);
  const needs = attention();
  // Installed as an app, the board shows the Needs you count on its Dock icon; 0 clears it.
  navigator.setAppBadge?.(needs.length).catch(() => {});
  const merged = mergedTickets();
  // The dispatcher counts a working worker outside the queue against its machine's slots, so the slots show it too.
  const slotted = [...live, ...adhoc.filter((t) => t.takesSlot)];
  renderNav(live, adhoc, slotted, needs, merged);
  renderStats(live, adhoc, needs);
  renderBays(slotted);
  renderNeeds(needs);
  renderCards(live);
  renderAdhoc(adhoc);
  if (typeof renderMachines === 'function') renderMachines(slotted);
  if (typeof renderGollum === 'function') renderGollum();
  renderReady();
  renderMerged(merged);
  renderAlarm();
  if (typeof sceneSync === 'function') sceneSync();
  // horn.js sounds the war horn when main turns red, in every view.
  if (typeof hornWatch === 'function') hornWatch();
  freshness();
}
// The group headers carry fixed glyphs.
$('gBuildIco').innerHTML = ICON.run;
$('gAdhocIco').innerHTML = ICON.run;
$('gReadyIco').innerHTML = ICON.todo;
$('gMergedIco').innerHTML = ICON.ok;
$('gNeedsIco').innerHTML = ICON.seal;

function freshness() {
  const el = $('fresh');
  if (failing && Date.now() - lastOk > 90000) {
    el.className = 'fresh stale';
    $('freshText').textContent = `Board unreachable, showing data from ${snap ? ago(snap.generatedAt) : 'never'}`;
    return;
  }
  el.className = `fresh ${snap?.refreshing ? 'busy' : 'live'}`;
  $('freshText').textContent = snap ? `Data from ${ago(snap.generatedAt)}${snap.refreshing ? ', refreshing' : ''}` : '';
}

async function poll() {
  try {
    const res = await fetch('/api/snapshot', { cache: 'no-store' });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    const next = await res.json();
    const same = snap && next.generatedAt === snap.generatedAt;
    const first = !snap;
    snap = next; lastOk = Date.now(); failing = null;
    // The realm table comes from the config, so it is filled before anything renders.
    fillRealms(snap.config, snap.machines);
    $('banner').innerHTML = '';
    same ? freshness() : render();
    // A link to one machine's card can only scroll once the cards exist.
    if (first) applyView();
    // A snapshot the server was still refreshing is worth a quicker second look.
    schedule(snap.refreshing ? 5000 : POLL_MS);
  } catch (e) {
    failing = e.message;
    if (!snap) $('banner').innerHTML = `<div class="banner">The board could not load: ${esc(e.message)}</div>`;
    freshness();
    schedule(POLL_MS);
  }
}
setInterval(freshness, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(0); });

// The Clipboard API needs a secure context, and a plain http:// address on a tailnet is not one, so fall back to execCommand. The
// API can also refuse a write (an unfocused page), which falls back the same way.
function copyText(text) {
  const legacy = () => {
    const ta = Object.assign(document.createElement('textarea'), { value: text });
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).catch(legacy); return true; }
  return legacy();
}
document.addEventListener('click', async (e) => {
  // Open in terminal: the open-row button with a ticket, other than View session (the Sessions view's Handled has none).
  const b = e.target.closest('button.open');
  if (!b || !b.closest('.open-row') || b.classList.contains('view') || !b.dataset.id) return;
  const msg = b.nextElementSibling;
  b.disabled = true;
  msg.textContent = 'Opening...';
  try {
    const r = await fetch(`/api/open?id=${encodeURIComponent(b.dataset.id)}`, { method: 'POST', headers: { 'X-Board': 'open' } });
    const body = await r.json().catch(() => ({}));
    if (r.ok) msg.textContent = 'Opened in iTerm';
    else if (r.status === 409 && body.cmd) msg.textContent = copyText(body.cmd) ? `This board runs on ${boardName()}, so the ssh command is copied: paste it in a terminal` : body.cmd;
    else msg.textContent = body.error || `Could not open it (${r.status})`;
  } catch (err) {
    msg.textContent = `Could not open it: ${err.message}`;
  }
  b.disabled = false;
});
// The view comes from the URL: #inbox is the Inbox, #sessions is Sessions, #machines (or #machines/<host> for one
// machine's card) is Machines,
// #worktrees (or #worktrees/<host>) is Worktrees, #gollum (or #gollum/<host>) is what Gollum found (gollum-view.js), and anything else (a ticket anchor, the session panel's #session=) is
// the Queue.
// #map is Middle-earth seen from above (v2, scene2.js). The view that showed both side by side (#both) is retired
// (2026-11-09), so an old #both link opens the map.
const VIEWS = { queue: 'Agent queue', inbox: 'Inbox', sessions: 'Sessions', machines: 'Machines', worktrees: 'Worktrees', gollum: 'Gollum', scene: 'Middle-earth',
  map: 'Middle-earth from above' };
const TARGET = { machines: 'm', worktrees: 'wt', gollum: 'g' };
function applyView(fromClick = false) {
  const [name, target] = location.hash.slice(1).split('/');
  const next = name === 'both' ? 'map' : Object.hasOwn(VIEWS, name) ? name : 'queue';
  const switched = next !== view;
  view = next;
  for (const v of Object.keys(VIEWS)) {
    const el = $(`view-${v}`);
    if (el) el.hidden = view !== v;
  }
  // scene.js and scene2.js load after this script, so the first call, on page load, finds neither, and each starts itself.
  if (typeof sceneShow === 'function') sceneShow(view === 'scene');
  if (typeof mapShow === 'function') mapShow(view === 'map');
  // Each map fits the room it has when it shows, so a switch lays it out again.
  if (switched) window.dispatchEvent(new Event('resize'));
  $('viewTitle').textContent = VIEWS[view];
  document.querySelectorAll('.nav-item.view').forEach((el) => el.classList.toggle('active', el.dataset.view === view));
  // Where the sidebar is a strip that scrolls sideways, keep the open view's tab in sight (a phone has a bar: mobile.css).
  const strip = document.querySelector('.side'), tab = document.querySelector('.nav-item.view.active');
  if (tab && strip.scrollWidth > strip.clientWidth) strip.scrollLeft = tab.offsetLeft - 12;
  const card = TARGET[view] && target && $(`${TARGET[view]}-${decodeURIComponent(target)}`);
  if (card) card.scrollIntoView({ block: 'start' });
  else if (switched || fromClick) { $('main').scrollTop = 0; window.scrollTo(0, 0); }
}
window.addEventListener('popstate', () => applyView());
document.addEventListener('click', (e) => {
  const go = e.target.closest('a[data-go]');
  if (go && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
    e.preventDefault();
    history.pushState(null, '', go.getAttribute('href'));
    applyView(true);
  }
  // A group link scrolls to its group, switching back to the Queue first, without leaving the group in the URL.
  const jump = e.target.closest('a[data-jump]');
  if (jump) {
    e.preventDefault();
    if (view !== 'queue') { history.pushState(null, '', '#queue'); applyView(); }
    $(jump.getAttribute('href').slice(1))?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  }
  if (e.target.closest('.merged-all')) { mergedAll = !mergedAll; renderMerged(mergedTickets()); }
});
// The page is rebuilt from a fresh snapshot on load, so an old scroll position would land somewhere arbitrary.
history.scrollRestoration = 'manual';
// A view's name in the URL (#machines) is also the id of its container, so while the page loads the browser keeps
// scrolling to it, which hid the view's top under the sticky header; a typed #machines does the same. A bare view name
// starts at the top once the page has loaded and after each such change of the URL.
const atViewTop = () => { if (Object.hasOwn(VIEWS, location.hash.slice(1))) { $('main').scrollTop = 0; window.scrollTo(0, 0); } };
window.addEventListener('load', atViewTop);
window.addEventListener('hashchange', atViewTop);
applyView();
poll();
// The service worker (sw.js) makes the board installable. Browsers allow one only in a secure context, which the board
// has on localhost and not on its plain-HTTP tailnet names, so there the page runs as a normal tab.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

# Runs the repo's tests on every push and pull request. The tests use throwaway homes and fakes for every service
# manager, sign-in and other computer, so they need nothing but Node and the usual shell tools.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
